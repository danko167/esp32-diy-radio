; Waveshare ESP32-S3 Touch AMOLED 2.16"
; ESP32-S3R8: 16 MB quad flash + 8 MB octal PSRAM

[platformio]
default_envs = radio
; Optional and never committed, like a .env file: see secrets.ini.example.
; In private/, which ignores its own contents.
extra_configs =
    private/secrets.ini
; Compiled files kept and reused even after a full rebuild, when the same
; file is compiled the same way (most of them after a platformio.ini change)
build_cache_dir = .pio/build-cache

; Defaults for when there is no secrets.ini (OTA off, no fallback Wi-Fi)
[secrets]
ota_password =
wifi_ssid =
wifi_password =

[env:radio]
; pioarduino = community PlatformIO platform with Arduino core 3.x
; (the official espressif32 platform stops at Arduino 2.0.17)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; -O2: noticeably faster LVGL rendering than the default -Os, for some flash
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1  ; errors only; the Arduino IDE sets this, some libraries expect it
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
; Only our own sources, so changing a secret doesn't rebuild every library
build_src_flags =
    '-DOTA_PASSWORD="${secrets.ota_password}"'
    '-DFALLBACK_WIFI_SSID="${secrets.wifi_ssid}"'
    '-DFALLBACK_WIFI_PASSWORD="${secrets.wifi_password}"'

lib_deps =
    lvgl/lvgl@~9.6.0
    lewisxhe/SensorLib@^0.5.1
    lewisxhe/XPowersLib@^0.3.3
    bblanchon/ArduinoJson@^7.4.3
    ; GPL-3.0: internet radio and file playback (MP3, AAC, FLAC, Opus, Vorbis)
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0  ; 4.0.1 needs Arduino 3.3.12

; Uploads go through the running firmware first, which shows the progress on
; screen; esptool is the fallback (tools/usb_upload_hook.py)
extra_scripts =
    pre:tools/build_paths.py  ; no home folder (user name) in the firmware's file paths
    tools/link_flags.py
    pre:tools/embed_web.py  ; web/upload.html into the firmware
    post:tools/usb_upload_hook.py
; Native USB is unreliable at 921600 (esptool only; the USB link ignores it anyway)
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash over Wi-Fi, no cable: pio run -e radio-ota -t upload
; Needs ota_password in private/secrets.ini, and that firmware on the board once.
[env:radio-ota]
extends = env:radio
upload_protocol = espota
upload_port = diy-radio.local
upload_flags = --auth=${secrets.ota_password}
